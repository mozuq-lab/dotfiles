[permissions.personal-workspace]
description = "Personal workspace access with sensitive files denied."
extends = ":workspace"

[permissions.personal-workspace.filesystem]
glob_scan_max_depth = 16
# 一般のツール・SDK・システム設定は読み取り可能にする。
":root" = "read"
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.agents/skills" = "read"
"~/.codex/skills" = "read"
"~/.codex/plugins/cache" = "read"
"~/.nvm/versions/node" = "read"
# 開発ツールが作業フォルダ外に生成するキャッシュと SDK の更新先。
"~/.cache" = "write"
"~/.npm" = "write"
"~/.pub-cache" = "write"
"~/.dart-tool" = "write"
"~/.gradle" = "write"
"~/fvm" = "write"
"~/Library/Caches" = "write"
"~/Library/Android/sdk" = "write"
"~/Library/Developer/Xcode/DerivedData" = "write"
"~/Library/Developer/CoreSimulator" = "write"
"~/.codex/auth.json" = "deny"
"~/Library/Keychains" = "deny"
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.aws/credentials" = "deny"
"~/.config/gcloud" = "deny"
"~/.kube" = "deny"
"~/.docker/config.json" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.netrc" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.zsh_history" = "deny"
"~/.bash_history" = "deny"

[permissions.personal-workspace.filesystem.":workspace_roots"]
".git" = "write"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.*.local" = "deny"
"**/.env.development" = "deny"
"**/.env.dev" = "deny"
"**/.env.test" = "deny"
"**/.env.staging" = "deny"
"**/.env.production" = "deny"
"**/.env.prod" = "deny"
"**/.env.ci" = "deny"
"**/.envrc" = "deny"
"**/*.tfstate" = "deny"
"**/*.tfstate.*" = "deny"
"**/*.tfvars" = "deny"
"**/*.tfvars.json" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/*.keystore" = "deny"
"**/*.jks" = "deny"
"**/id_rsa" = "deny"
"**/id_ed25519" = "deny"

[permissions.personal-workspace.network]
enabled = true
